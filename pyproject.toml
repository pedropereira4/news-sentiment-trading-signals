[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-pipeline"
version = "0.1.0"
description = "Real-time news sentiment analysis pipeline: Kafka -> LLM -> InfluxDB -> Grafana"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "feedparser>=6.0",
    "httpx>=0.27",
    "influxdb-client>=1.44",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sp-producer = "sentiment_pipeline.producer.rss_producer:main"
sp-enricher = "sentiment_pipeline.enricher.main:main"
sp-writer = "sentiment_pipeline.writer.influx_writer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/sentiment_pipeline/llm/prompt.py" = ["E501"]
